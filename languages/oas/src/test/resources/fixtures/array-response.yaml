openapi: "3.0.0"
info:
  title: Arrays Response Regression Test API
  version: "v1"

servers:
  - url: https://example.com/{version}

paths:
  /test:
    get:
      operationId: TestGet
      responses:
        "200":
          description: |-
            200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Foo'


components:

  schemas:
    Foo:
      type: "object"
      required:
        - foo
      properties:
        foo:
          type: "string"
