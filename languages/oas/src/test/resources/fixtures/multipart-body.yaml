openapi: "3.0.0"
info:
  title: Multipart Body Test API
  version: "v1"

servers:
  - url: https://example.com/{version}

paths:
  /test:
    post:
      operationId: TestPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRequest'

          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TestMultipartRequest'

      responses:
        "200":
          description: |-
            200
          content: {}

components:

  schemas:
    TestRequest:
      type: "object"
      required:
        - prompt
      properties:
        prompt:
          type: "string"
    TestMultipartRequest:
      type: "object"
      required:
        - prompt
      properties:
        prompt:
          type: "string"
